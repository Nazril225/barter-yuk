<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarterYuk! - Platform Barter Barang Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header / Navbar (Week 2: Semantic HTML) -->
    <header>
        <div class="logo">🔄 BarterYuk!</div>
        <nav>
            <a href="#hero">Beranda</a>
            <a href="#katalog">Katalog Barang</a>
            <a href="#tambah">Tambah Barang</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section id="hero">
            <h1>Tukar Barangmu dengan yang Kamu Butuhkan</h1>
            <p>Solusi mudah, ramah lingkungan, dan hemat tanpa uang tunai.</p>
            <button id="btn-katalog" class="btn">Lihat Katalog</button>
        </section>

        <!-- Section Katalog Barang -->
        <section id="katalog">
            <h2>Barang Pilihan untuk Dibarter</h2>
            <div id="loading" style="text-align: center; color: #2563eb; margin-bottom: 15px;">Memuat data barang...</div>
            <div id="item-list" class="grid-container">
                <!-- Data barang akan dimuat secara dinamis melalui JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 BarterYuk! - Web Programming Project (Week 1 - 5)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
