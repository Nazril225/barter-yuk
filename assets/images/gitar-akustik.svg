<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Ilustrasi gitar akustik">
  <!-- Aset ilustrasi orisinal BarterYuk! (bebas dipakai & didistribusikan) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="520" rx="200" ry="24" fill="#7c2d12" opacity="0.12"/>

  <g transform="rotate(14 400 320)">
    <!-- Leher gitar -->
    <rect x="386" y="96" width="30" height="200" rx="6" fill="#92400e"/>
    <!-- Garis fret -->
    <g stroke="#fde68a" stroke-width="3" opacity="0.75">
      <line x1="388" y1="130" x2="414" y2="130"/>
      <line x1="388" y1="160" x2="414" y2="160"/>
      <line x1="388" y1="190" x2="414" y2="190"/>
      <line x1="388" y1="220" x2="414" y2="220"/>
      <line x1="388" y1="250" x2="414" y2="250"/>
    </g>

    <!-- Kepala gitar + tuning peg -->
    <rect x="378" y="52" width="46" height="56" rx="12" fill="#78350f"/>
    <circle cx="366" cy="68" r="7" fill="#fbbf24"/>
    <circle cx="366" cy="92" r="7" fill="#fbbf24"/>
    <circle cx="436" cy="68" r="7" fill="#fbbf24"/>
    <circle cx="436" cy="92" r="7" fill="#fbbf24"/>

    <!-- Badan gitar -->
    <path d="M401 250c-58 0-104 40-104 92 0 30 16 50 40 60-26 12-44 36-44 66 0 52 48 88 108 88s108-36 108-88c0-30-18-54-44-66 24-10 40-30 40-60 0-52-46-92-104-92z" fill="url(#wood)"/>

    <!-- Lubang suara + bridge -->
    <circle cx="401" cy="382" r="34" fill="#451a03"/>
    <circle cx="401" cy="382" r="34" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.6"/>
    <rect x="357" y="452" width="88" height="14" rx="7" fill="#451a03"/>

    <!-- Senar -->
    <g stroke="#fef9c3" stroke-width="2.4" opacity="0.9">
      <line x1="394" y1="60" x2="394" y2="452"/>
      <line x1="401" y1="60" x2="401" y2="452"/>
      <line x1="408" y1="60" x2="408" y2="452"/>
    </g>

    <!-- Penanda fret -->
    <circle cx="401" cy="175" r="5" fill="#fef3c7"/>
    <circle cx="401" cy="235" r="5" fill="#fef3c7"/>
  </g>
</svg>
