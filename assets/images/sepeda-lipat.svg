<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Ilustrasi sepeda lipat">
  <!-- Aset ilustrasi orisinal BarterYuk! (bebas dipakai & didistribusikan) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.5" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="516" rx="270" ry="24" fill="#1e3a8a" opacity="0.10"/>

  <g fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round">
    <!-- roda -->
    <circle cx="235" cy="400" r="96"/>
    <circle cx="565" cy="400" r="96"/>
  </g>

  <!-- jari-jari roda -->
  <g stroke="#94a3b8" stroke-width="5">
    <line x1="235" y1="304" x2="235" y2="496"/>
    <line x1="139" y1="400" x2="331" y2="400"/>
    <line x1="167" y1="332" x2="303" y2="468"/>
    <line x1="303" y1="332" x2="167" y2="468"/>
    <line x1="565" y1="304" x2="565" y2="496"/>
    <line x1="469" y1="400" x2="661" y2="400"/>
    <line x1="497" y1="332" x2="633" y2="468"/>
    <line x1="633" y1="332" x2="497" y2="468"/>
  </g>
  <circle cx="235" cy="400" r="12" fill="#334155"/>
  <circle cx="565" cy="400" r="12" fill="#334155"/>

  <!-- rangka lipat -->
  <g fill="none" stroke="#2563eb" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 400h130l80-104h120"/>
    <path d="M365 400l80-104"/>
    <path d="M445 296l120 104"/>
    <path d="M365 400l-40-70"/>
    <path d="M325 330l-40-24"/>
  </g>

  <!-- sadel -->
  <path d="M276 300h-56a10 10 0 0 0 0 20h68z" fill="#0f172a"/>
  <!-- setang -->
  <path d="M445 296l46-58h52" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="545" cy="238" r="10" fill="#0f172a"/>

  <!-- pedal + engkol -->
  <circle cx="365" cy="400" r="20" fill="#0f172a"/>
  <circle cx="365" cy="400" r="8" fill="#93c5fd"/>
  <!-- engsel lipat -->
  <rect x="352" y="386" width="26" height="28" rx="6" fill="#f59e0b"/>
</svg>
